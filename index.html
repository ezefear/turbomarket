<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TurboMarket</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🚀 TurboMarket</div>
    <form id="searchForm" class="search">
      <input id="symbolInput" placeholder="AAPL, NVDA, BTC-USD..." autocomplete="off">
      <button>Buscar</button>
      <button type="button" id="favoriteBtn">★</button>
    </form>
    <select id="themeSelect">
      <option value="dark">Oscuro</option>
      <option value="light">Claro</option>
    </select>
  </header>

  <main>
    <aside id="sidebar">
      <div class="side-title">
        <strong>Favoritos</strong>
        <button id="collapseBtn">☰</button>
      </div>
      <ul id="favorites"></ul>
    </aside>

    <div id="resizer"></div>

    <section class="workspace">
      <div class="toolbar">
        <div>
          <strong id="currentSymbol">AAPL</strong>
          <small id="provider">Yahoo Finance</small>
        </div>
        <div id="intervals">
          <button data-interval="1d" class="active">1D</button>
          <button data-interval="1wk">1W</button>
          <button data-interval="1mo">1M</button>
        </div>
        <button id="fitBtn" class="secondary">Ajustar</button>
      </div>
      <div id="status">Iniciando...</div>
      <div id="chart"></div>
    </section>
  </main>

  <script src="js/yahoo.js"></script>
  <script src="js/binance.js"></script>
  <script src="js/datafeed.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
